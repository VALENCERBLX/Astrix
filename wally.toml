[package]
name = "valence/astrix"
version = "0.1.0"
description = "An in-game command console for Roblox, driven by Kyn — a bash-inspired shell language."
license = "MIT"
authors = ["Valence"]
registry = "https://github.com/UpliftGames/wally-index"
realm = "shared"

[dependencies]
# None. Lume (UI), Switch (input) and Substance (networking) are all vendored
# under src/_Packages, so Astrix installs as one self-contained tree and there
# is no version to keep in step.
